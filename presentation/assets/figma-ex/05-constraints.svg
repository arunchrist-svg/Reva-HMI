<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img">
  <title>Constraints. Pin-up Bar stays on the phone when you stretch it.</title>
  <rect width="1200" height="640" fill="#101116"/>
  <rect x="16" y="16" width="1168" height="608" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
  <rect x="16" y="16" width="1168" height="44" rx="12" fill="#14161c"/>
  <rect x="16" y="48" width="1168" height="12" fill="#14161c"/>
  <text x="36" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">V</text>
  <rect x="56" y="26" width="28" height="22" rx="5" fill="#d4f169"/>
  <text x="70" y="42" fill="#101116" font-family="system-ui,sans-serif" font-size="13" font-weight="800" text-anchor="middle">F</text>
  <text x="98" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">R</text>
  <text x="126" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">T</text>
  <text x="1100" y="42" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12" text-anchor="end">Design</text>

  <text x="80" y="100" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="2">FAIL</text>
  <rect x="80" y="120" width="420" height="280" rx="20" fill="#1b1d24" stroke="#3a3d46" stroke-width="2"/>
  <rect x="80" y="120" width="200" height="56" fill="#2a2d36"/>
  <text x="180" y="156" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="18" font-weight="800" text-anchor="middle">Pin-up</text>
  <text x="80" y="430" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16">Top + Left. You stretch. Bar stays in the corner.</text>

  <text x="80" y="480" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="2">PIN-UP</text>
  <rect x="80" y="500" width="420" height="90" rx="12" fill="#1b1d24" stroke="#d4f169" stroke-width="2"/>
  <rect x="80" y="500" width="420" height="56" fill="#2a2d36"/>
  <text x="290" y="536" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="18" font-weight="800" text-anchor="middle">Pin-up</text>
  <text x="80" y="620" fill="#d4f169" font-family="system-ui,sans-serif" font-size="16">Left + Right. Bar spans the phone.</text>

  <rect x="560" y="88" width="600" height="500" rx="12" fill="#16181e"/>
  <text x="860" y="130" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">CONSTRAINTS</text>
  <text x="860" y="160" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Select Bar. Right sidebar. Position.</text>

  <rect x="760" y="200" width="200" height="200" fill="none" stroke="#3a3d46" stroke-width="3"/>
  <rect x="830" y="188" width="60" height="16" rx="3" fill="#d4f169"/>
  <text x="860" y="201" fill="#101116" font-family="system-ui,sans-serif" font-size="11" font-weight="800" text-anchor="middle">Top</text>
  <rect x="748" y="270" width="16" height="60" rx="3" fill="#d4f169"/>
  <text x="756" y="304" fill="#101116" font-family="system-ui,sans-serif" font-size="11" font-weight="800" text-anchor="middle" transform="rotate(-90 756 304)">Left</text>
  <rect x="956" y="270" width="16" height="60" rx="3" fill="#d4f169"/>
  <text x="964" y="304" fill="#101116" font-family="system-ui,sans-serif" font-size="11" font-weight="800" text-anchor="middle" transform="rotate(90 964 304)">Right</text>
  <rect x="830" y="396" width="60" height="16" rx="3" fill="#3a3d46"/>
  <text x="860" y="408" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11" font-weight="800" text-anchor="middle">Bottom</text>

  <text x="860" y="460" fill="#d4f169" font-family="system-ui,sans-serif" font-size="22" font-weight="800" text-anchor="middle">Left  +  Right</text>
  <text x="860" y="500" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Bar stays the full width.</text>
  <text x="860" y="540" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Or skip this: Shift+A on the phone.</text>
</svg>

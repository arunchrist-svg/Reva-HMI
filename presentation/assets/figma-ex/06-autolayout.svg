  <rect x="16" y="16" width="1168" height="608" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
  <rect x="16" y="16" width="1168" height="44" rx="12" fill="#14161c"/>
  <rect x="16" y="48" width="1168" height="12" fill="#14161c"/>
  <text x="36" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">V</text><rect x="56" y="26" width="26" height="22" rx="5" fill="#d4f169"/><text x="69" y="42" fill="#101116" font-family="system-ui,sans-serif" font-size="13" font-weight="800" text-anchor="middle">F</text><text x="92" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">R</text><text x="120" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">T</text>
    <text x="1100" y="42" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12" text-anchor="end">Design</text>
  <text x="80" y="100" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13">Poster</text>
  <rect x="80" y="120" width="100" height="44" rx="8" fill="#d4f169"/>
  <text x="92" y="148" fill="#101116" font-family="system-ui,sans-serif" font-size="14" font-weight="800">Booked</text>
  <text x="80" y="190" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Word clipped. Fixed box.</text>
  <text x="80" y="280" fill="#d4f169" font-family="system-ui,sans-serif" font-size="13">Auto layout  ·  hug</text>
  <rect x="80" y="300" width="88" height="44" rx="8" fill="#d4f169"/>
  <text x="102" y="328" fill="#101116" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">Book</text>
  <rect x="80" y="360" width="118" height="44" rx="8" fill="#d4f169"/>
  <text x="139" y="388" fill="#101116" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">Booked</text>
  <text x="80" y="430" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Shift+A. Pad 16 / 10. Hug both.</text>
  <rect x="860" y="80" width="300" height="500" fill="#16181e"/>
  <text x="880" y="112" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12" font-weight="700">AUTO LAYOUT</text>
  <text x="880" y="148" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14">Flow  Horizontal</text>
  <text x="880" y="180" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Gap  10</text>
  <text x="880" y="212" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Pad  16  ·  10</text>
  <text x="880" y="244" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Align  Center</text>
  <text x="880" y="292" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14">W  Hug</text>
  <text x="880" y="324" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14">H  Hug</text>
  <text x="400" y="240" fill="#ece9e1" font-family="Georgia,serif" font-size="28">On Pin-up</text>
  <text x="400" y="280" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16">Book becomes Booked.</text>
  <text x="400" y="308" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16">The control must grow.</text>


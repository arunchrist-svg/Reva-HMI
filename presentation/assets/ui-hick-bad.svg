<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Six equal actions, no primary</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#ece9e1" stroke-opacity=".2"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="84" fill="#ece9e1" font-family="Georgia,serif" font-size="22">What next?</text>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#101116">
    <rect x="48" y="118" width="184" height="40" rx="8" fill="#ece9e1"/>
    <text x="140" y="143" text-anchor="middle">Share</text>
    <rect x="48" y="170" width="184" height="40" rx="8" fill="#ece9e1"/>
    <text x="140" y="195" text-anchor="middle">Save draft</text>
    <rect x="48" y="222" width="184" height="40" rx="8" fill="#ece9e1"/>
    <text x="140" y="247" text-anchor="middle">Boost</text>
    <rect x="48" y="274" width="184" height="40" rx="8" fill="#ece9e1"/>
    <text x="140" y="299" text-anchor="middle">Message</text>
    <rect x="48" y="326" width="184" height="40" rx="8" fill="#ece9e1"/>
    <text x="140" y="351" text-anchor="middle">Report</text>
    <rect x="48" y="378" width="184" height="40" rx="8" fill="#ece9e1"/>
    <text x="140" y="403" text-anchor="middle">Post listing</text>
  </g>
  <text x="140" y="500" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Six equal buttons. Freeze.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img">
  <title>Two pay frames with no tap between them</title>
  <rect width="640" height="560" fill="#101116"/>
  <rect x="48" y="16" width="224" height="500" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="138" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="68" y="88" fill="#ece9e1" font-family="Georgia,serif" font-size="20">Pay the mess</text>
  <text x="68" y="120" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13">Lunch  Rs 80</text>
  <rect x="68" y="400" width="184" height="48" rx="10" fill="#d4f169"/>
  <text x="160" y="430" fill="#101116" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Pay Rs 80</text>
  <rect x="368" y="16" width="224" height="500" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="458" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="388" y="88" fill="#ece9e1" font-family="Georgia,serif" font-size="20">Paid</text>
  <text x="388" y="120" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13">Rs 80  12:14 pm</text>
  <text x="388" y="160" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="13">Mess counter got it.</text>
  <rect x="388" y="400" width="184" height="48" rx="10" fill="#d4f169"/>
  <text x="480" y="430" fill="#101116" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Done</text>
</svg>

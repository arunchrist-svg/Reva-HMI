<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="uxDoorsTitle">
  <title id="uxDoorsTitle">Norman door: poor signifiers versus clear pull handle</title>
  <rect width="920" height="320" fill="#1b1d24"/>
  <text x="230" y="36" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">POOR UX</text>
  <text x="690" y="36" fill="#d4f169" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">GOOD UX</text>
  <!-- Bad door -->
  <rect x="60" y="60" width="340" height="220" rx="4" fill="#2a2d36" stroke="#a4a3a0" stroke-width="2"/>
  <rect x="200" y="120" width="60" height="100" rx="2" fill="#3d4049" stroke="#ece9e1" stroke-width="1.5"/>
  <text x="230" y="200" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="28" text-anchor="middle">?</text>
  <text x="230" y="300" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Flat plate  push or pull?</text>
  <!-- Good door -->
  <rect x="520" y="60" width="340" height="220" rx="4" fill="#2a2d36" stroke="#d4f169" stroke-width="2"/>
  <path d="M780 130 C820 130 820 210 780 210" fill="none" stroke="#d4f169" stroke-width="10" stroke-linecap="round"/>
  <text x="690" y="200" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">PULL</text>
  <path d="M700 240 L730 255 L700 270" fill="none" stroke="#ece9e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="690" y="300" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Handle signifier matches action</text>
  <line x1="460" y1="50" x2="460" y2="290" stroke="#40434d" stroke-width="2" stroke-dasharray="6 8"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img">
  <title>Tesler: keep complexity in the system</title>
  <rect width="720" height="720" fill="#101116"/>
  <rect x="28" y="28" width="664" height="664" rx="8" fill="#1b1d24" stroke="#ece9e1" stroke-opacity=".17"/>
  <rect x="120" y="200" width="200" height="280" rx="8" fill="#101116" stroke="#ece9e1" stroke-opacity=".2"/>
  <text x="220" y="250" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14" letter-spacing="2" text-anchor="middle">THEM</text>
  <rect x="150" y="280" width="140" height="16" fill="#3a3d46"/>
  <rect x="150" y="310" width="140" height="16" fill="#3a3d46"/>
  <rect x="150" y="340" width="140" height="16" fill="#3a3d46"/>
  <rect x="150" y="370" width="140" height="16" fill="#3a3d46"/>
  <text x="220" y="440" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">type Rs 80 again</text>
  <rect x="400" y="160" width="200" height="360" rx="8" fill="#101116" stroke="#d4f169" stroke-width="3"/>
  <text x="500" y="210" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14" letter-spacing="2" text-anchor="middle">SYSTEM</text>
  <rect x="430" y="250" width="140" height="16" fill="#d4f169" opacity=".35"/>
  <rect x="430" y="280" width="140" height="16" fill="#d4f169" opacity=".5"/>
  <rect x="430" y="310" width="140" height="16" fill="#d4f169" opacity=".7"/>
  <rect x="430" y="340" width="140" height="28" fill="#d4f169"/>
  <text x="500" y="430" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">already Rs 80</text>
  <text x="360" y="580" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16" letter-spacing="2" text-anchor="middle">THEIR HOMEWORK STAYS HERE</text>
</svg>

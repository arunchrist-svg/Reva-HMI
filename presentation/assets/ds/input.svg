<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 168" role="img">
  <title>Unlabelled field versus labelled input</title>
  <rect width="504" height="168" fill="#101116"/>
  <rect x="8" y="8" width="238" height="152" rx="16" fill="#1b1d24" stroke="#ece9e1" stroke-opacity=".22"/>
  <text x="24" y="34" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="9" font-weight="800" letter-spacing="1.6">WEAK</text>
  <rect x="24" y="58" width="206" height="44" rx="8" fill="#101116" stroke="#ece9e1" stroke-opacity=".25"/>
  <text x="38" y="84" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13">Type here</text>
  <text x="24" y="132" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">What is this asking?</text>
  <rect x="258" y="8" width="238" height="152" rx="16" fill="#1b1d24" stroke="#d4f169" stroke-opacity=".55"/>
  <text x="274" y="34" fill="#d4f169" font-family="system-ui,sans-serif" font-size="9" font-weight="800" letter-spacing="1.6">WHERE</text>
  <text x="274" y="58" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12" font-weight="700">UPI ID</text>
  <rect x="274" y="68" width="206" height="40" rx="8" fill="#101116" stroke="#d4f169" stroke-opacity=".45"/>
  <text x="288" y="93" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13">name@okaxis</text>
  <text x="274" y="132" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">Label on the field. Helper under.</text>
</svg>

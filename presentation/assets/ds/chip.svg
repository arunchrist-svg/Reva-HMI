<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Chips as filters on a list</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="64" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Pin-up</text>
  <rect x="48" y="88" width="64" height="28" rx="14" fill="#d4f169"/>
  <text x="80" y="107" fill="#101116" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Today</text>
  <rect x="120" y="88" width="80" height="28" rx="14" fill="#101116" stroke="#3a3d46"/>
  <text x="160" y="107" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Tomorrow</text>

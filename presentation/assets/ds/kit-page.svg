<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img">
  <title>Kit page with six parts</title>
  <rect width="720" height="480" fill="#101116"/>
  <text x="32" y="40" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">FIGMA PAGE · KIT</text>
  <text x="32" y="72" fill="#ece9e1" font-family="Georgia,serif" font-size="28">Six parts. Today.</text>
  <g>
    <rect x="32" y="108" width="200" height="48" rx="10" fill="#d4f169"/>
    <text x="132" y="138" fill="#101116" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Pay Rs 80</text>
    <text x="32" y="176" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Button · the verb</text>
  </g>
  <g>
    <text x="268" y="124" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="11">Amount</text>
    <rect x="268" y="132" width="180" height="40" rx="8" fill="#1b1d24" stroke="#3a3d46"/>
    <text x="284" y="158" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Rs 80</text>
    <text x="268" y="192" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Field · one fact</text>
  </g>
  <g>
    <rect x="484" y="108" width="204" height="56" rx="10" fill="#1b1d24" stroke="#3a3d46"/>
    <text x="500" y="132" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="13">Lunch · today</text>
    <text x="500" y="152" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">Block B · Rs 80</text>
    <text x="484" y="192" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Row · pick one</text>
  </g>
  <g>
    <rect x="32" y="228" width="200" height="40" rx="8" fill="#1b1d24" stroke="#3a3d46"/>
    <text x="48" y="254" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="13">‹  Mess lunch</text>
    <text x="32" y="292" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Bar · way out</text>
  </g>
  <g>
    <rect x="268" y="220" width="180" height="88" rx="14" fill="#24262e" stroke="#3a3d46"/>
    <rect x="340" y="232" width="28" height="4" rx="2" fill="#ece9e1" opacity=".3"/>
    <text x="284" y="268" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="13">Pay Rs 80?</text>
    <text x="268" y="332" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Sheet · decide here</text>
  </g>
  <g>
    <rect x="484" y="228" width="204" height="52" rx="10" fill="#d4f169"/>
    <text x="500" y="250" fill="#101116" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Paid. Rs 80.</text>
    <text x="500" y="268" fill="#101116" font-family="system-ui,sans-serif" font-size="11">12:14 · show at the door</text>
    <text x="484" y="304" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Toast · what happened</text>
  </g>
  <text x="32" y="400" fill="#ece9e1" font-family="Georgia,serif" font-size="20">Phones live on another page.</text>
  <text x="32" y="432" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14">If Kit and Job sit on one canvas, you will detach.</text>
</svg>

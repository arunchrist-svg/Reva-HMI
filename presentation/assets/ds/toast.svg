<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Paid as a toast on the same job</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="88" fill="#ece9e1" font-family="Georgia,serif" font-size="22">Pay the mess</text>
  <text x="48" y="122" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14">Lunch  Rs 80</text>
  <rect x="48" y="148" width="184" height="64" rx="12" fill="#d4f169"/>
  <text x="64" y="176" fill="#101116" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Paid. Rs 80.</text>
  <text x="64" y="196" fill="#101116" font-family="system-ui,sans-serif" font-size="12">12:14 · show this at the door</text>
  <rect x="48" y="430" width="184" height="52" rx="10" fill="#3a3d46"/>
  <text x="140" y="462" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Already paid</text>
</svg>

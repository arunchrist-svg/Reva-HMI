<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>AI payment screen with extra chrome</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <rect x="48" y="48" width="184" height="28" rx="8" fill="#101116" stroke="#3a3d46"/>
  <text x="60" y="67" fill="#6c6b68" font-family="system-ui,sans-serif" font-size="11">Search payments</text>
  <g fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="9">

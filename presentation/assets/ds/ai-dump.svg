  <text x="60" y="172" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12">Recommended</text>
  <text x="60" y="194" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">Add money · Rewards</text>
  <rect x="48" y="226" width="84" height="64" rx="10" fill="#101116" stroke="#3a3d46"/>
  <rect x="148" y="226" width="84" height="64" rx="10" fill="#101116" stroke="#3a3d46"/>
  <text x="90" y="262" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">Scan</text>

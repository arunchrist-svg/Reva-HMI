  <text x="112" y="108" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">Night</text>
  <text x="24" y="138" fill="#ece9e1" font-family="Georgia,serif" font-size="14">Not random hex.</text>
  <rect x="176" y="8" width="152" height="152" rx="16" fill="#1b1d24" stroke="#ece9e1" stroke-opacity=".22"/>

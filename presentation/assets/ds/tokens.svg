<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 168" role="img">
  <title>Tokens: color, type, space</title>
  <rect width="504" height="168" fill="#101116"/>
  <rect x="8" y="8" width="152" height="152" rx="16" fill="#1b1d24" stroke="#ece9e1" stroke-opacity=".22"/>
  <text x="24" y="34" fill="#d4f169" font-family="system-ui,sans-serif" font-size="9" font-weight="800" letter-spacing="1.6">COLOR</text>
  <rect x="24" y="50" width="36" height="36" rx="8" fill="#d4f169"/>
  <rect x="68" y="50" width="36" height="36" rx="8" fill="#ece9e1"/>
  <rect x="112" y="50" width="36" height="36" rx="8" fill="#1b1d24" stroke="#ece9e1" stroke-opacity=".4"/>
  <text x="24" y="108" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">Lime</text>

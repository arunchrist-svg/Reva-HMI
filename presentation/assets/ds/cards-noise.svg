<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Six equal cards for one lunch</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="78" fill="#ece9e1" font-family="Georgia,serif" font-size="20">Pick a meal</text>
  <g fill="#101116" stroke="#3a3d46">
    <rect x="48" y="108" width="84" height="88" rx="10"/>
    <rect x="148" y="108" width="84" height="88" rx="10"/>
    <rect x="48" y="208" width="84" height="88" rx="10"/>
    <rect x="148" y="208" width="84" height="88" rx="10"/>
    <rect x="48" y="308" width="84" height="88" rx="10"/>
    <rect x="148" y="308" width="84" height="88" rx="10"/>
  </g>
  <g fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <text x="90" y="158">Breakfast</text>
    <text x="190" y="158">Lunch</text>
    <text x="90" y="258">Snacks</text>
    <text x="190" y="258">Dinner</text>
    <text x="90" y="358">Extra</text>
    <text x="190" y="358">Combo</text>
  </g>

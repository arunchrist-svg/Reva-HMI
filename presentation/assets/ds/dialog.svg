<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Dialog blocking the screen</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#101116" opacity=".55"/>
  <rect x="52" y="190" width="176" height="168" rx="16" fill="#24262e" stroke="#3a3d46"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" role="img">
  <title>Same Pay on both screens</title>
  <rect width="580" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="78" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">Today</text>
  <text x="48" y="118" fill="#ece9e1" font-family="Georgia,serif" font-size="22">Pay the mess</text>
  <text x="48" y="152" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14">Lunch  Rs 80</text>
  <rect x="48" y="430" width="184" height="52" rx="10" fill="#d4f169"/>
  <text x="140" y="462" fill="#101116" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Pay Rs 80</text>
  <text x="140" y="538" fill="#d4f169" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Button / Primary</text>
  <rect x="328" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="418" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="348" y="78" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">Failed</text>
  <text x="348" y="118" fill="#ece9e1" font-family="Georgia,serif" font-size="22">Try again</text>
  <text x="348" y="152" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14">UPI timed out</text>
  <rect x="348" y="430" width="184" height="52" rx="10" fill="#d4f169"/>
  <text x="440" y="462" fill="#101116" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Pay Rs 80</text>
  <text x="440" y="538" fill="#d4f169" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Same instance</text>
</svg>

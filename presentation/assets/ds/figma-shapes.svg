<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img">
  <title>Six shape tools</title>
  <rect width="960" height="360" fill="#101116"/>
  <rect x="40" y="80" width="110" height="80" fill="#2a2d36" stroke="#ece9e1" stroke-width="3"/>
  <text x="95" y="220" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">R</text>
  <text x="95" y="244" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Rectangle</text>
  <line x1="200" y1="160" x2="310" y2="80" stroke="#ece9e1" stroke-width="3"/>
  <text x="255" y="220" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">L</text>
  <text x="255" y="244" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Line</text>
  <line x1="360" y1="160" x2="470" y2="80" stroke="#ece9e1" stroke-width="3"/>
  <polygon points="470,80 456,92 462,96" fill="#ece9e1"/>
  <text x="415" y="220" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">Shift L</text>
  <text x="415" y="244" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Arrow</text>
  <ellipse cx="560" cy="120" rx="48" ry="48" fill="none" stroke="#ece9e1" stroke-width="3"/>
  <text x="560" y="220" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">O</text>
  <text x="560" y="244" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Ellipse</text>
  <polygon points="680,72 720,160 640,160" fill="none" stroke="#ece9e1" stroke-width="3"/>
  <text x="680" y="220" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">Shift O</text>
  <text x="680" y="244" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Polygon</text>
  <polygon points="840,72 854,112 896,112 862,136 874,176 840,152 806,176 818,136 784,112 826,112" fill="none" stroke="#ece9e1" stroke-width="3"/>
  <text x="840" y="220" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">Star</text>
  <text x="480" y="320" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Shape tool. Then a fill.</text>
</svg>

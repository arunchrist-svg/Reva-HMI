  <text x="48" y="84" fill="#ece9e1" font-family="Georgia,serif" font-size="20">Details</text>
  <g font-family="system-ui,sans-serif">
    <rect x="48" y="110" width="184" height="36" rx="6" fill="#ece9e1" opacity=".08" stroke="#ece9e1" stroke-opacity=".25"/>
    <rect x="48" y="156" width="184" height="36" rx="6" fill="#ece9e1" opacity=".08" stroke="#ece9e1" stroke-opacity=".25"/>
    <rect x="48" y="202" width="184" height="36" rx="6" fill="#ece9e1" opacity=".08" stroke="#ece9e1" stroke-opacity=".25"/>
    <rect x="48" y="248" width="184" height="36" rx="6" fill="#ece9e1" opacity=".08" stroke="#ece9e1" stroke-opacity=".25"/>
    <rect x="48" y="294" width="184" height="36" rx="6" fill="#ece9e1" opacity=".08" stroke="#ece9e1" stroke-opacity=".25"/>
    <rect x="48" y="340" width="184" height="36" rx="6" fill="#ece9e1" opacity=".08" stroke="#ece9e1" stroke-opacity=".25"/>
    <text x="60" y="132" fill="#a4a3a0" font-size="12">type here</text>
    <text x="60" y="178" fill="#a4a3a0" font-size="12">type here</text>
    <text x="60" y="224" fill="#a4a3a0" font-size="12">type here</text>
    <text x="60" y="270" fill="#a4a3a0" font-size="12">98765 43210</text>
    <text x="48" y="400" fill="#ff6b6b" font-size="11">Invalid format. Use +91XXXXXXXXXX</text>
    <rect x="48" y="430" width="184" height="36" rx="8" fill="#ece9e1" opacity=".2"/>
    <text x="140" y="453" fill="#ece9e1" font-size="12" text-anchor="middle">Continue</text>
  </g>
  <text x="140" y="510" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">No labels. Too many fields. Fussy.</text>

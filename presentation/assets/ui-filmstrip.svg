<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img">
  <title>Three frames of the same screen</title>
  <rect width="900" height="420" fill="#101116"/>
  <g font-family="system-ui,sans-serif">
    <rect x="24" y="24" width="260" height="372" rx="24" fill="#1b1d24" stroke="#ece9e1" stroke-opacity=".2"/>
    <text x="154" y="56" fill="#a4a3a0" font-size="11" text-anchor="middle" letter-spacing="1.4">READY</text>
    <text x="48" y="96" fill="#ece9e1" font-family="Georgia,serif" font-size="18">Pay the mess</text>
    <text x="48" y="124" fill="#a4a3a0" font-size="13">Rs 80  lunch</text>
    <rect x="48" y="300" width="212" height="44" rx="8" fill="#d4f169"/>
    <text x="154" y="328" fill="#101116" font-size="14" font-weight="700" text-anchor="middle">Pay Rs 80</text>

    <rect x="320" y="24" width="260" height="372" rx="24" fill="#1b1d24" stroke="#ece9e1" stroke-opacity=".2"/>
    <text x="450" y="56" fill="#a4a3a0" font-size="11" text-anchor="middle" letter-spacing="1.4">EMPTY</text>
    <text x="344" y="96" fill="#ece9e1" font-family="Georgia,serif" font-size="18">Pay the mess</text>
    <text x="344" y="168" fill="#ece9e1" font-size="14">Nothing due today.</text>
    <text x="344" y="192" fill="#a4a3a0" font-size="13">Come back at lunch.</text>
    <rect x="344" y="300" width="212" height="44" rx="8" fill="#ece9e1" opacity=".12"/>
    <text x="450" y="328" fill="#a4a3a0" font-size="14" font-weight="700" text-anchor="middle">See history</text>

    <rect x="616" y="24" width="260" height="372" rx="24" fill="#1b1d24" stroke="#d4f169" stroke-opacity=".55"/>
    <text x="746" y="56" fill="#d4f169" font-size="11" text-anchor="middle" letter-spacing="1.4">AFTER</text>
    <text x="640" y="96" fill="#ece9e1" font-family="Georgia,serif" font-size="18">Paid</text>
    <text x="640" y="124" fill="#a4a3a0" font-size="13">Rs 80  12:14 pm</text>
    <text x="640" y="168" fill="#ece9e1" font-size="14">Mess counter got it.</text>
    <rect x="640" y="300" width="212" height="44" rx="8" fill="#d4f169"/>
    <text x="746" y="328" fill="#101116" font-size="14" font-weight="700" text-anchor="middle">Done</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Bad · checkboxes for one exclusive pick</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="92" fill="#ece9e1" font-family="Georgia,serif" font-size="22">Pick a plan</text>
  <text x="48" y="122" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13">Only one is allowed. This lies.</text>
  <rect x="48" y="160" width="18" height="18" rx="3" fill="#d4f169"/>
  <text x="76" y="175" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Free</text>
  <rect x="48" y="206" width="18" height="18" rx="3" fill="#d4f169"/>
  <text x="76" y="221" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Plus</text>
  <rect x="48" y="252" width="18" height="18" rx="3" fill="none" stroke="#ece9e1"/>
  <text x="76" y="267" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Pro</text>
  <text x="48" y="510" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">Exclusive pick. That is radio.</text>
</svg>

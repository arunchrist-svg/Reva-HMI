<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Bad · switch for an agreement</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="92" fill="#ece9e1" font-family="Georgia,serif" font-size="22">I agree</text>
  <text x="48" y="122" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13">A switch is not a signature.</text>
  <text x="48" y="200" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Terms of use</text>
  <rect x="170" y="182" width="52" height="30" rx="15" fill="#d4f169"/>
  <circle cx="204" cy="197" r="11" fill="#101116"/>
  <text x="48" y="510" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">That is a checkbox. Not a switch.</text>
</svg>

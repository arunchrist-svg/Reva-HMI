<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Bad · radio for an independent yes</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#3a3d46"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="92" fill="#ece9e1" font-family="Georgia,serif" font-size="22">I agree</text>
  <text x="48" y="122" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13">An independent yes. Not a pair.</text>
  <circle cx="57" cy="169" r="9" fill="none" stroke="#d4f169"/>
  <circle cx="57" cy="169" r="4" fill="#d4f169"/>
  <text x="76" y="175" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">Yes</text>

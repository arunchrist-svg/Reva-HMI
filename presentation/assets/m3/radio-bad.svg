  <text x="76" y="221" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">No</text>
  <text x="48" y="510" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="11">That is a checkbox. Not a radio.</text>

  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#d4f169" stroke-opacity=".55"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="84" fill="#ece9e1" font-family="Georgia,serif" font-size="20">How to reach you</text>
  <g font-family="system-ui,sans-serif">
    <text x="48" y="122" fill="#d4f169" font-size="11" font-weight="700">Phone</text>
    <rect x="48" y="132" width="184" height="44" rx="8" fill="#ece9e1" opacity=".08" stroke="#d4f169" stroke-opacity=".55"/>
    <text x="60" y="160" fill="#ece9e1" font-size="14">98765 43210</text>
    <text x="48" y="196" fill="#a4a3a0" font-size="11">WhatsApp number is fine.</text>
    <text x="48" y="232" fill="#d4f169" font-size="11" font-weight="700">Meetup place</text>
    <rect x="48" y="242" width="184" height="44" rx="8" fill="#ece9e1" opacity=".08" stroke="#ece9e1" stroke-opacity=".25"/>
    <text x="60" y="270" fill="#ece9e1" font-size="14">Hostel B lobby</text>
    <rect x="48" y="430" width="184" height="52" rx="10" fill="#d4f169"/>
    <text x="140" y="462" fill="#101116" font-size="16" font-weight="700" text-anchor="middle">Post listing</text>
  </g>
  <text x="140" y="510" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Ask only this step. Accept real input.</text>
</svg>

  <rect x="56" y="26" width="28" height="22" rx="5" fill="#d4f169"/>
  <text x="70" y="42" fill="#101116" font-family="system-ui,sans-serif" font-size="13" font-weight="800" text-anchor="middle">F</text>
  <text x="96" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">R</text>

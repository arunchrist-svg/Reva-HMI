<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img">
  <title>V is the move tool. Click a thing. Move it.</title>
  <rect width="1200" height="640" fill="#101116"/>
  <rect x="80" y="160" width="1040" height="280" rx="16" fill="#1a1c22" stroke="#2a2d36"/>
  <rect x="80" y="160" width="1040" height="72" rx="16" fill="#14161c"/>
  <rect x="80" y="216" width="1040" height="16" fill="#14161c"/>
  <g transform="translate(120 178)">
    <rect x="0" y="0" width="44" height="36" rx="8" fill="#d4f169"/>
    <text x="22" y="24" fill="#101116" font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">V</text>
    <text x="70" y="24" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16" font-weight="700">F</text>
    <text x="108" y="24" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16" font-weight="700">R</text>
    <text x="148" y="24" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="16" font-weight="700">T</text>
  </g>
  <text x="980" y="202" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">Move  ·  V</text>
  <text x="160" y="300" fill="#ece9e1" font-family="Georgia,serif" font-size="42">Move</text>
  <text x="160" y="354" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="20">Click a thing. Drag it. Resize the corners.</text>
  <text x="160" y="392" fill="#d4f169" font-family="system-ui,sans-serif" font-size="16" font-weight="700">You do not need the rest of the toolbar today.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img">
  <title>Figma has three parts: layers, canvas, design panel</title>
  <rect width="1200" height="640" fill="#101116"/>
  <rect x="16" y="16" width="1168" height="608" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
  <rect x="16" y="16" width="1168" height="44" rx="12" fill="#14161c"/>
  <rect x="16" y="48" width="1168" height="12" fill="#14161c"/>
  <text x="36" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">V</text>
  <text x="64" y="44" fill="#d4f169" font-family="system-ui,sans-serif" font-size="13" font-weight="700">F</text>
  <text x="90" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">R</text>
  <text x="118" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="13" font-weight="700">T</text>
  <text x="600" y="44" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Primary task</text>
  <text x="1120" y="44" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12" text-anchor="end">Design</text>
  <rect x="16" y="60" width="220" height="564" fill="#16181e"/>
  <text x="36" y="92" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">LAYERS</text>
  <rect x="32" y="108" width="188" height="28" rx="6" fill="#d4f169" fill-opacity=".12" stroke="#d4f169" stroke-opacity=".45"/>
  <text x="44" y="127" fill="#d4f169" font-family="system-ui,sans-serif" font-size="12">Page 1</text>
  <text x="44" y="168" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Frame 1</text>
  <rect x="236" y="60" width="724" height="564" fill="#101116"/>
  <rect x="236" y="60" width="724" height="564" fill="url(#grid)" opacity=".35"/>
  <rect x="960" y="60" width="224" height="564" fill="#16181e"/>
  <text x="980" y="92" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">DESIGN</text>
  <text x="980" y="124" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">Fill</text>
  <rect x="980" y="136" width="184" height="22" rx="4" fill="#2a2d36"/>
  <text x="980" y="184" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">W  390</text>
  <text x="1088" y="184" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">H  844</text>
  <text x="126" y="612" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Left</text>
  <text x="598" y="612" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Canvas</text>
  <text x="1072" y="612" fill="#d4f169" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Right</text>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2a2d36" stroke-width="1"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Calm home: one job for eight minutes</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#161C18" stroke="#B7D4A8" stroke-opacity=".45"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#E8EDE6" opacity=".22"/>
  <text x="48" y="78" fill="#8A9388" font-family="system-ui,sans-serif" font-size="11">Good afternoon, Arya</text>
  <text x="48" y="122" fill="#E8EDE6" font-family="Georgia,serif" font-size="26">You have</text>
  <text x="48" y="154" fill="#E8EDE6" font-family="Georgia,serif" font-size="26">8 minutes.</text>
  <text x="48" y="198" fill="#8A9388" font-family="system-ui,sans-serif" font-size="13">Breath for stress</text>
  <rect x="48" y="430" width="184" height="52" rx="10" fill="#B7D4A8"/>
  <text x="140" y="462" fill="#161C18" font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Begin</text>
  <text x="140" y="404" fill="#8A9388" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">or pick another</text>
  <text x="62" y="508" fill="#B7D4A8" font-family="system-ui,sans-serif" font-size="9">Home</text>
  <text x="108" y="508" fill="#5d6a60" font-family="system-ui,sans-serif" font-size="9">Discover</text>
  <text x="168" y="508" fill="#5d6a60" font-family="system-ui,sans-serif" font-size="9">Journal</text>
  <text x="216" y="508" fill="#5d6a60" font-family="system-ui,sans-serif" font-size="9">Profile</text>
</svg>

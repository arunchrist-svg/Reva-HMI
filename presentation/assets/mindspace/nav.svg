<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
  <title>Arya moves between Home, Discover, Journal, Profile</title>
  <rect width="720" height="280" fill="#101116"/>
  <text x="36" y="40" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">BOTTOM NAVIGATION  -  ONE PRODUCT</text>
  <g>
    <rect x="36" y="70" width="150" height="150" rx="20" fill="#161C18" stroke="#B7D4A8"/>
    <text x="111" y="132" fill="#B7D4A8" font-family="Georgia,serif" font-size="22" text-anchor="middle">Home</text>
    <text x="111" y="162" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">8 minutes now</text>
    <text x="111" y="192" fill="#E8EDE6" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Arya is here</text>
  </g>
  <g>
    <rect x="202" y="70" width="150" height="150" rx="20" fill="#161C18" stroke="#3a4a40"/>
    <text x="277" y="132" fill="#E8EDE6" font-family="Georgia,serif" font-size="22" text-anchor="middle">Discover</text>
    <text x="277" y="162" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Find a practice</text>
  </g>
  <g>
    <rect x="368" y="70" width="150" height="150" rx="20" fill="#161C18" stroke="#3a4a40"/>
    <text x="443" y="132" fill="#E8EDE6" font-family="Georgia,serif" font-size="22" text-anchor="middle">Journal</text>
    <text x="443" y="162" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">How that felt</text>
  </g>
  <g>
    <rect x="534" y="70" width="150" height="150" rx="20" fill="#161C18" stroke="#3a4a40"/>
    <text x="609" y="132" fill="#E8EDE6" font-family="Georgia,serif" font-size="22" text-anchor="middle">Profile</text>
    <text x="609" y="162" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Come back</text>
  </g>
  <path d="M186 145 H202" stroke="#B7D4A8" stroke-width="2"/>
  <path d="M352 145 H368" stroke="#3a4a40" stroke-width="2"/>
  <path d="M518 145 H534" stroke="#3a4a40" stroke-width="2"/>
</svg>

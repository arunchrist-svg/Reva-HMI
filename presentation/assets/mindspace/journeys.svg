<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img">
  <title>Eight journeys, one Mindspace</title>
  <rect width="960" height="420" fill="#101116"/>
  <text x="32" y="36" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">ARYA'S DAY  -  EIGHT DESKS  -  ONE APP</text>
  <g font-family="Georgia,serif" fill="#E8EDE6">
    <rect x="32" y="64" width="200" height="72" rx="12" fill="#161C18" stroke="#B7D4A8"/>
    <text x="48" y="96" font-size="18">1 Arrive</text>
    <text x="48" y="118" font-size="12" fill="#8A9388" font-family="system-ui,sans-serif">First 5 minutes</text>
    <rect x="256" y="64" width="200" height="72" rx="12" fill="#161C18" stroke="#3a4a40"/>
    <text x="272" y="96" font-size="18">2 Home</text>
    <text x="272" y="118" font-size="12" fill="#8A9388" font-family="system-ui,sans-serif">What now</text>
    <rect x="480" y="64" width="200" height="72" rx="12" fill="#161C18" stroke="#3a4a40"/>
    <text x="496" y="96" font-size="18">3 Discover</text>
    <text x="496" y="118" font-size="12" fill="#8A9388" font-family="system-ui,sans-serif">Find without jargon</text>
    <rect x="704" y="64" width="200" height="72" rx="12" fill="#161C18" stroke="#3a4a40"/>
    <text x="720" y="96" font-size="18">4 Session</text>
    <text x="720" y="118" font-size="12" fill="#8A9388" font-family="system-ui,sans-serif">Play, pause, return</text>
    <rect x="32" y="176" width="200" height="72" rx="12" fill="#161C18" stroke="#3a4a40"/>
    <text x="48" y="208" font-size="18">5 Journal</text>
    <text x="48" y="230" font-size="12" fill="#8A9388" font-family="system-ui,sans-serif">Two taps of feeling</text>
    <rect x="256" y="176" width="200" height="72" rx="12" fill="#161C18" stroke="#3a4a40"/>
    <text x="272" y="208" font-size="18">6 Sleep</text>
    <text x="272" y="230" font-size="12" fill="#8A9388" font-family="system-ui,sans-serif">Night, stay quiet</text>
    <rect x="480" y="176" width="200" height="72" rx="12" fill="#161C18" stroke="#3a4a40"/>
    <text x="496" y="208" font-size="18">7 Profile</text>
    <text x="496" y="230" font-size="12" fill="#8A9388" font-family="system-ui,sans-serif">Progress without shame</text>
    <rect x="704" y="176" width="200" height="72" rx="12" fill="#161C18" stroke="#3a4a40"/>
    <text x="720" y="208" font-size="18">8 Return</text>
    <text x="720" y="230" font-size="12" fill="#8A9388" font-family="system-ui,sans-serif">After a gap</text>
  </g>
  <path d="M232 100 H256 M456 100 H480 M680 100 H704" stroke="#B7D4A8" stroke-width="2" fill="none"/>
  <path d="M804 136 V176 M132 136 V176 M356 248 H480" stroke="#3a4a40" stroke-width="2" fill="none"/>
  <text x="32" y="300" fill="#B7D4A8" font-family="Georgia,serif" font-size="22">If a handoff is missing, it is not one product.</text>
  <text x="32" y="340" fill="#8A9388" font-family="system-ui,sans-serif" font-size="14">Arrive lands on Home. Home and Discover start a Session. Session can open Journal. Sleep stays dim. Profile and Return send her back to Home.</text>
  <text x="32" y="368" fill="#8A9388" font-family="system-ui,sans-serif" font-size="14">Shared nav: Home  -  Discover  -  Journal  -  Profile. Player and onboarding have no tabs.</text>
</svg>

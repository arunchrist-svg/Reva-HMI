<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img">
  <title>Session interrupted, then held</title>
  <rect width="640" height="560" fill="#101116"/>
  <rect x="48" y="16" width="224" height="500" rx="28" fill="#161C18" stroke="#3a4a40"/>
  <rect x="138" y="28" width="44" height="6" rx="3" fill="#E8EDE6" opacity=".22"/>
  <text x="68" y="88" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12">Breath  -  stress</text>
  <circle cx="160" cy="240" r="78" fill="none" stroke="#3a4a40" stroke-width="8"/>
  <circle cx="160" cy="240" r="78" fill="none" stroke="#B7D4A8" stroke-width="8" stroke-dasharray="180 320" transform="rotate(-90 160 240)"/>
  <text x="160" y="236" fill="#E8EDE6" font-family="Georgia,serif" font-size="28" text-anchor="middle">6:12</text>
  <text x="160" y="262" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">left</text>
  <text x="160" y="430" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">Phone ringing</text>
  <rect x="68" y="448" width="184" height="40" rx="8" fill="#243028"/>
  <text x="160" y="474" fill="#E8EDE6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pause</text>
  <rect x="368" y="16" width="224" height="500" rx="28" fill="#161C18" stroke="#B7D4A8" stroke-opacity=".5"/>
  <rect x="458" y="28" width="44" height="6" rx="3" fill="#E8EDE6" opacity=".22"/>
  <text x="388" y="88" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12">Held for you</text>
  <text x="388" y="200" fill="#E8EDE6" font-family="Georgia,serif" font-size="26">6 minutes</text>
  <text x="388" y="236" fill="#E8EDE6" font-family="Georgia,serif" font-size="26">still here.</text>
  <text x="388" y="280" fill="#8A9388" font-family="system-ui,sans-serif" font-size="13">The world interrupted.</text>
  <text x="388" y="300" fill="#8A9388" font-family="system-ui,sans-serif" font-size="13">Arya did not fail.</text>
  <rect x="388" y="400" width="184" height="48" rx="10" fill="#B7D4A8"/>
  <text x="480" y="430" fill="#161C18" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Resume</text>
  <text x="480" y="468" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">or end kindly</text>
  <path d="M272 424 C 312 424, 348 280, 368 200" fill="none" stroke="#B7D4A8" stroke-width="3"/>
</svg>

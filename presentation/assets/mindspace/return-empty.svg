<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img">
  <title>Empty after a gap: silence versus an invitation</title>
  <rect width="640" height="560" fill="#101116"/>
  <rect x="48" y="16" width="224" height="500" rx="28" fill="#161C18" stroke="#3a4a40"/>
  <rect x="138" y="28" width="44" height="6" rx="3" fill="#E8EDE6" opacity=".22"/>
  <text x="68" y="88" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12">Home</text>
  <text x="160" y="250" fill="#5d6a60" font-family="Georgia,serif" font-size="20" text-anchor="middle">Nothing here</text>
  <text x="160" y="508" fill="#5d6a60" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">Home  Discover  Journal  Profile</text>
  <rect x="368" y="16" width="224" height="500" rx="28" fill="#161C18" stroke="#B7D4A8" stroke-opacity=".5"/>
  <rect x="458" y="28" width="44" height="6" rx="3" fill="#E8EDE6" opacity=".22"/>
  <text x="388" y="88" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12">11 days later</text>
  <text x="388" y="180" fill="#E8EDE6" font-family="Georgia,serif" font-size="24">Still here</text>
  <text x="388" y="212" fill="#E8EDE6" font-family="Georgia,serif" font-size="24">when you have</text>
  <text x="388" y="244" fill="#E8EDE6" font-family="Georgia,serif" font-size="24">5 minutes.</text>
  <rect x="388" y="400" width="184" height="48" rx="10" fill="#B7D4A8"/>
  <text x="480" y="430" fill="#161C18" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Begin</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
  <title>Arya entering her name: four field states</title>
  <rect width="720" height="420" fill="#101116"/>
  <g>
    <text x="24" y="36" fill="#8A9388" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">DEFAULT</text>
    <text x="24" y="78" fill="#E8EDE6" font-family="system-ui,sans-serif" font-size="13">First name</text>
    <rect x="24" y="90" width="150" height="44" rx="8" fill="#161C18" stroke="#3a4a40"/>
    <text x="38" y="117" fill="#5d6a60" font-family="system-ui,sans-serif" font-size="14">Name</text>
    <text x="24" y="154" fill="#5d6a60" font-family="system-ui,sans-serif" font-size="11">You can skip this.</text>
  </g>
  <g>
    <text x="198" y="36" fill="#8A9388" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">FOCUSED</text>
    <text x="198" y="78" fill="#B7D4A8" font-family="system-ui,sans-serif" font-size="13">First name</text>
    <rect x="198" y="90" width="150" height="44" rx="8" fill="#161C18" stroke="#B7D4A8" stroke-width="2"/>
    <text x="212" y="117" fill="#E8EDE6" font-family="system-ui,sans-serif" font-size="14">Arya</text>
    <rect x="250" y="102" width="1.5" height="22" fill="#B7D4A8"/>
    <text x="198" y="154" fill="#8A9388" font-family="system-ui,sans-serif" font-size="11">You can skip this.</text>
  </g>
  <g>
    <text x="372" y="36" fill="#8A9388" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">INVALID</text>
    <text x="372" y="78" fill="#E8A0A0" font-family="system-ui,sans-serif" font-size="13">First name</text>
    <rect x="372" y="90" width="150" height="44" rx="8" fill="#161C18" stroke="#E8A0A0" stroke-width="2"/>
    <text x="386" y="117" fill="#E8EDE6" font-family="system-ui,sans-serif" font-size="14">A</text>
    <text x="372" y="154" fill="#E8A0A0" font-family="system-ui,sans-serif" font-size="11">Use your first name.</text>
  </g>
  <g>
    <text x="546" y="36" fill="#8A9388" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">HELPFUL</text>
    <text x="546" y="78" fill="#E8EDE6" font-family="system-ui,sans-serif" font-size="13">First name</text>
    <rect x="546" y="90" width="150" height="44" rx="8" fill="#161C18" stroke="#3a4a40"/>
    <text x="560" y="117" fill="#E8EDE6" font-family="system-ui,sans-serif" font-size="14">Arya</text>
    <text x="546" y="154" fill="#8A9388" font-family="system-ui,sans-serif" font-size="11">You can change this later.</text>
  </g>
  <text x="24" y="220" fill="#B7D4A8" font-family="Georgia,serif" font-size="22">The field is not a box.</text>
  <text x="24" y="256" fill="#E8EDE6" font-family="Georgia,serif" font-size="18">It is four conversations with Arya.</text>
  <text x="24" y="310" fill="#8A9388" font-family="system-ui,sans-serif" font-size="14">Material 3 pattern: label, field, helper, error. Teaching diagram - not a Figma export.</text>
  <text x="24" y="338" fill="#8A9388" font-family="system-ui,sans-serif" font-size="14">Default waits. Focused listens. Invalid explains. Helpful lets her continue.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Sleep wind-down stays dim</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#121614" stroke="#2a332c"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#E8EDE6" opacity=".12"/>
  <text x="48" y="88" fill="#6b756e" font-family="system-ui,sans-serif" font-size="12">11:20 pm</text>
  <text x="48" y="140" fill="#C9D4C4" font-family="Georgia,serif" font-size="26">Wind down.</text>
  <text x="48" y="184" fill="#6b756e" font-family="system-ui,sans-serif" font-size="13">10 minutes. Low light.</text>
  <circle cx="140" cy="300" r="54" fill="none" stroke="#2a332c" stroke-width="6"/>
  <circle cx="140" cy="300" r="54" fill="none" stroke="#7A8F74" stroke-width="6" stroke-dasharray="80 260" transform="rotate(-90 140 300)"/>
  <rect x="48" y="430" width="184" height="48" rx="10" fill="#2a332c"/>
  <text x="140" y="460" fill="#C9D4C4" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">Play</text>
</svg>

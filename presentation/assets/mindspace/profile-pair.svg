<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img">
  <title>Streak shame versus a kind return</title>
  <rect width="640" height="560" fill="#101116"/>
  <rect x="48" y="16" width="224" height="500" rx="28" fill="#161C18" stroke="#3a4a40"/>
  <rect x="138" y="28" width="44" height="6" rx="3" fill="#E8EDE6" opacity=".22"/>
  <text x="68" y="88" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12">Profile</text>
  <text x="68" y="140" fill="#E8A0A0" font-family="Georgia,serif" font-size="28">Streak 0</text>
  <text x="68" y="176" fill="#E8A0A0" font-family="system-ui,sans-serif" font-size="13">You broke it.</text>
  <rect x="68" y="210" width="184" height="8" rx="4" fill="#3a4a40"/>
  <rect x="68" y="210" width="12" height="8" rx="4" fill="#E8A0A0"/>
  <text x="68" y="250" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12">Badges locked</text>
  <text x="68" y="272" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12">Leaderboard   -   847th</text>
  <rect x="68" y="448" width="184" height="40" rx="8" fill="#243028"/>
  <text x="160" y="474" fill="#E8A0A0" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Repair streak</text>
  <rect x="368" y="16" width="224" height="500" rx="28" fill="#161C18" stroke="#B7D4A8" stroke-opacity=".5"/>
  <rect x="458" y="28" width="44" height="6" rx="3" fill="#E8EDE6" opacity=".22"/>
  <text x="388" y="88" fill="#8A9388" font-family="system-ui,sans-serif" font-size="12">Profile</text>
  <text x="388" y="140" fill="#E8EDE6" font-family="Georgia,serif" font-size="26">You came</text>
  <text x="388" y="174" fill="#E8EDE6" font-family="Georgia,serif" font-size="26">back.</text>
  <text x="388" y="220" fill="#8A9388" font-family="system-ui,sans-serif" font-size="13">4 sessions this month.</text>
  <text x="388" y="242" fill="#8A9388" font-family="system-ui,sans-serif" font-size="13">The gap is not the story.</text>
  <rect x="388" y="400" width="184" height="48" rx="10" fill="#B7D4A8"/>
  <text x="480" y="430" fill="#161C18" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Start today</text>
</svg>

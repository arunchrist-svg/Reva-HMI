<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" role="img">
  <title>Error that says what happened and what to do</title>
  <rect width="280" height="560" fill="#101116"/>
  <rect x="28" y="16" width="224" height="528" rx="28" fill="#1b1d24" stroke="#d4f169" stroke-opacity=".55"/>
  <rect x="118" y="28" width="44" height="6" rx="3" fill="#ece9e1" opacity=".25"/>
  <text x="48" y="84" fill="#ece9e1" font-family="Georgia,serif" font-size="22">Post this item</text>
  <text x="48" y="122" fill="#d4f169" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Phone</text>
  <rect x="48" y="132" width="184" height="44" rx="8" fill="#ece9e1" opacity=".08" stroke="#d4f169" stroke-opacity=".55"/>
  <text x="60" y="160" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="14">98765 4321</text>
  <text x="48" y="204" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="13">That number is short one digit.</text>
  <text x="48" y="226" fill="#a4a3a0" font-family="system-ui,sans-serif" font-size="12">10 digits. Spaces are fine.</text>
  <rect x="48" y="430" width="184" height="52" rx="10" fill="#d4f169"/>
  <text x="140" y="462" fill="#101116" font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Try again</text>
  <text x="140" y="510" fill="#ece9e1" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">What happened. What next.</text>
</svg>
